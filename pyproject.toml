[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-pipeline"
version = "0.1.0"
description = "AI 内容生产管线：知识库投喂、多步生成、三层质检与多渠道分发"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Content Pipeline Contributors" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "numpy>=1.24",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# 生产级 ML 能力：语义 Embedding + FAISS 向量检索
ml = [
  "sentence-transformers>=2.7",
  "faiss-cpu>=1.8",
]
# 分布式任务队列
worker = [
  "celery>=5.3",
  "redis>=5.0",
]
# 开发与测试
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.8",
  "jieba>=0.42",
  "pyyaml>=6.0",
]

[project.scripts]
ai-content-pipeline = "ai_content_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

