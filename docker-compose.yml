services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: content_pipeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    command: uvicorn ai_content_pipeline.api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@postgres:5432/content_pipeline
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started

  worker:
    build: .
    command: celery -A ai_content_pipeline.workers.celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@postgres:5432/content_pipeline
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started

  scheduler:
    build: .
    command: python -m ai_content_pipeline.workers.scheduler_loop
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@postgres:5432/content_pipeline
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:

