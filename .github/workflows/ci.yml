name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: |
          if grep -RInE "DEEPSEEK_API_KEY=sk-[A-Za-z0-9]{8,}|QWEN_API_KEY=sk-[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{16,}|sk-[A-Za-z0-9]{24,}" \
            --exclude-dir=.git --exclude-dir=data --exclude=.env.example .; then
            echo "::error::Potential secret detected in repository"
            exit 1
          fi
          echo "No secrets found"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        run: python -m ai_content_pipeline.cli demo --quick
